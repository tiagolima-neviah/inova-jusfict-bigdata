[project]
name = "inova-jusfict-bigdata"
version = "0.2.0"
description = "JusFict Inova: gerador sintético e pipeline de dados (staging, bronze, silver, gold, warehouse). Empresa fictícia, dados sintéticos declarados."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# Catálogo é texto: frase longa de descrição não se quebra no meio.
"inova_bigdata/gerador/catalogo.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["inova_bigdata", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
